name: "Bug Report"
description: Report an issue or possible bug
type: "Bug"
labels: ["Needs triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a bug report! Please fill out this form as completely as possible. If you're not sure how to fill out a section, do your best and we'll help you along the way.
  - type: textarea
    id: bug-description
    attributes:
      label: What's the problem?
      description: A clear and concise description of what the problem is. Screenshots, a screen recording, or a small board as a ZIP file help a lot.
    validations:
      required: true
  - type: textarea
    id: bug-reproduction
    attributes:
      label: How can we reproduce it?
      description: The steps that lead to the problem, if you know them.
      placeholder: |
        1. Open a board
        2. Paste an image
        3. …
  - type: textarea
    id: bug-expectation
    attributes:
      label: What's the expected result?
      description: Describe what you expect to happen.
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating System
      description: Its name and version, which the app cannot tell.
      placeholder: e.g., macOS 15.1, Ubuntu 24.04, Windows 11
    validations:
      required: true
  # The app's Report a bug fills this field by its id, see web/src/bugreport.ts.
  - type: textarea
    id: environment-info
    attributes:
      label: Environment Information
      description: |
        Please provide the following information:
        - Planche version, and whether you use the web app or the desktop app (the web app runs the latest release once reloaded)
        - Browser and its version, for the web app (e.g., Firefox 131)

        Report a bug, in Planche's menu, fills this in.
    validations:
      required: true
  - type: checkboxes
    id: will-pr
    attributes:
      label: Participation
      options:
        - label: I am willing to submit a pull request for this issue.
          required: false

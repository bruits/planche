name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the newest release's web app even if nothing was published
        type: boolean
        default: false
      bundle:
        description: Attach the newest release's desktop installers even if nothing was published
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

# Every run waits its turn, as a merged release whose run was dropped would never be tagged.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # Windows runners default to PowerShell.
    shell: bash

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.sampo.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Sampo refreshes Cargo.lock once it bumps the app's version.
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - id: sampo
        uses: bruits/sampo/crates/sampo-github-action@main
        with:
          command: auto
          create-github-release: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Build the web app
    needs: release
    # A later run finds the tag already pushed and publishes nothing, so a dispatch can force what follows.
    if: needs.release.outputs.published == 'true' || inputs.deploy || inputs.bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Comes first, as every step below reads the tree. Sampo tags the commit this run is on, and a
      # dispatch takes the newest release.
      - id: tag
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*')
          git checkout "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          # rust-cache keys on every installed toolchain: keep only the pinned one.
          rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup toolchain uninstall stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # The CLI must match the wasm-bindgen crate that Cargo.lock pins.
      - id: wasm-bindgen
        run: echo "version=$(cargo pkgid wasm-bindgen | sed 's/.*@//')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - run: pnpm --dir web install --frozen-lockfile
      # CI runs beside this workflow and gates nothing, and a release regenerates Cargo.lock, so the
      # release tests what it ships. `just test` builds the web app first.
      - run: just test
      # Built once, as the desktop app embeds the same web app on every system.
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/public

  deploy:
    name: Deploy the web app
    needs: [release, web]
    if: needs.release.outputs.published == 'true' || inputs.deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.web.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web/public
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

  bundle:
    name: Attach the desktop installers (${{ matrix.os }})
    needs: [release, web]
    if: needs.release.outputs.published == 'true' || inputs.bundle
    strategy:
      fail-fast: false
      matrix:
        # Each installer the app updates from comes with the signature its updater checks.
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            installers: >-
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
              target/universal-apple-darwin/release/bundle/macos/Planche.app.tar.gz*
            app: target/universal-apple-darwin/release/bundle/macos/Planche.app
          - os: windows-latest
            installers: target/release/bundle/nsis/*.exe*
          # The oldest runner, as the deb and the AppImage need at least the glibc they were built
          # against, so they reach Ubuntu 22.04 and Debian 12.
          - os: ubuntu-22.04
            installers: target/release/bundle/deb/*.deb* target/release/bundle/appimage/*.AppImage*
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.web.outputs.tag }}
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          # rust-cache keys on every installed toolchain: keep only the pinned one.
          rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup toolchain uninstall stable
      - if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Tauri renders through WebKitGTK on Linux, which plays videos through GStreamer. The AppImage
      # carries the GStreamer plugins installed here.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav gstreamer1.0-gl \
            gstreamer1.0-alsa
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web/public
      # Pinned, as the Mac build hands the Apple signing secrets to this CLI. Bump it with the tauri
      # crate.
      - run: npm install --global @tauri-apps/cli@2.12.2
      # The Windows installer has no Authenticode signature yet, only the updater's.
      - if: runner.os != 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tauri build ${{ matrix.args }}
      # Tauri signs the Mac app with the Developer ID, notarizes it, and staples the ticket.
      - if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tauri build ${{ matrix.args }}
      # Tauri only warns when it cannot notarize and ignores a failed staple, so the Mac app proves
      # it is notarized and stapled before it ships. spctl alone accepts an unstapled app, whose
      # first launch then needs the network.
      - if: runner.os == 'macOS'
        run: |
          xcrun stapler validate "${{ matrix.app }}"
          spctl --assess --type execute --verbose=2 "${{ matrix.app }}"
      # Without the manifest first, which would pair the installers replaced here with their old
      # signatures until the last job writes it again.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.web.outputs.tag }}
        run: |
          gh release delete-asset "$TAG" latest.json --yes || true
          gh release upload "$TAG" ${{ matrix.installers }} --clobber

  updater:
    name: Point the desktop app to its update
    # Once every installer is up, as the app looks for this release's as soon as it is the latest.
    needs: [release, web, bundle]
    if: needs.release.outputs.published == 'true' || inputs.bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.web.outputs.tag }}
          sparse-checkout: crates/desktop/tauri.conf.json
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.web.outputs.tag }}
        run: |
          gh release download "$TAG" --pattern '*.sig' --dir signatures
          # The CLI only warns when the signing key is not the one the app trusts, whose installers
          # every installed app would then refuse.
          key() { sed -n 2p | base64 -d | od -An -tx1 -j2 -N8 | tr -d ' \n'; }
          trusted=$(jq -r .plugins.updater.pubkey crates/desktop/tauri.conf.json | base64 -d | key)
          for signature in signatures/*.sig; do
            if [ "$(base64 -d < "$signature" | key)" != "$trusted" ]; then
              echo "::error::$signature was not signed with the key whose public half is in tauri.conf.json"
              exit 1
            fi
          done
          address="https://github.com/$GH_REPO/releases/download/$TAG"
          # The universal Mac app answers for both processors.
          for signature in signatures/*.sig; do
            installer=$(basename "$signature" .sig)
            case "$installer" in
              *.app.tar.gz) keys="darwin-aarch64-app darwin-x86_64-app" ;;
              *-setup.exe) keys="windows-x86_64-nsis" ;;
              *.AppImage) keys="linux-x86_64-appimage" ;;
              *.deb) keys="linux-x86_64-deb" ;;
              *) continue ;;
            esac
            for key in $keys; do
              jq -n --arg key "$key" --arg url "$address/$installer" --rawfile signature "$signature" \
                '{($key): {$url, $signature}}'
            done
          done | jq -s add > platforms.json
          gh release view "$TAG" --json body,publishedAt > release.json
          # The version the installers were signed for, which the updater checks.
          jq -n --arg version "${TAG#v}" --slurpfile release release.json \
            --slurpfile platforms platforms.json \
            '{$version, notes: $release[0].body, pub_date: $release[0].publishedAt, platforms: $platforms[0]}' \
            > latest.json
          gh release upload "$TAG" latest.json --clobber

[package]
name = "render-wgpu"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

# Web only: native builds get an empty crate.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "ImageBitmap"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "webgl", "webgpu"] }

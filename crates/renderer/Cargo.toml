[package]
name = "renderer"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["gif", "png", "webp"] }
thiserror.workspace = true

# Web only: native builds only decode animations, for tests.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "HtmlMediaElement", "HtmlVideoElement", "ImageBitmap"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "webgl", "webgpu"] }

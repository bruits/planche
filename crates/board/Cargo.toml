[package]
name = "board"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The board's types declared in TypeScript, which the web app's bindings take at build time only.
ts = ["dep:ts-rs"]

[dependencies]
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
# The JSON the web app sends.
serde_json.workspace = true

[package]
name = "desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
# Not inherited, since Sampo reads only a literal one and would try to publish the app.
publish = false

# Tauri needs WebKitGTK on Linux, and there is nothing to test here, so tests skip it.
[[bin]]
name = "desktop"
path = "src/main.rs"
test = false

[dependencies]
folder.workspace = true
# Which files of a board the page may write and delete.
format.workspace = true
mcp.workspace = true
# Already in Tauri's tree, through `url`.
percent-encoding = "2"
tauri = "2"
tauri-plugin-dialog = "2"
# Opens an image's source in the system's browser, which the webview cannot. Tauri's own opener
# plugin wraps it, with D-Bus and an async runtime besides.
open = "5"

[build-dependencies]
tauri-build = "2"

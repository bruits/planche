[package]
name = "desktop"
version = "0.4.0"
edition.workspace = true
license.workspace = true
# Not inherited, since Sampo reads only a literal one and would try to publish the app.
publish = false

# Tauri needs WebKitGTK on Linux, and there is nothing to test here, so tests skip it.
[[bin]]
name = "desktop"
path = "src/main.rs"
test = false

[dependencies]
folder.workspace = true
# Which files of a board the page may write and delete.
format.workspace = true
mcp.workspace = true
# Already in Tauri's tree, through `url`.
percent-encoding = "2"
tauri = "2"
tauri-plugin-dialog = "2"
# The context Tauri generates holds the plugins' configuration as JSON.
serde_json.workspace = true
# Held to a minor, as its `configure_client` hands out a reqwest client that a minor may change.
# Without `zip`, which only reads the archives of Tauri 1's updater, never made here.
tauri-plugin-updater = { version = "~2.13", default-features = false, features = [
    "rustls-tls",
    "system-proxy",
] }
# Waits a day between checks for a new version. Already in the tree, through Tauri and `mcp`.
tokio = { version = "1", features = ["time"] }
# Opens an image's source in the system's browser, which the webview cannot. Tauri's own opener
# plugin wraps it, with D-Bus and an async runtime besides.
open = "5"

[build-dependencies]
tauri-build = "2"

[package]
name = "desktop"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Tauri needs WebKitGTK on Linux, and there is nothing to test here, so tests skip it.
[[bin]]
name = "desktop"
path = "src/main.rs"
test = false

[dependencies]
folder.workspace = true
mcp.workspace = true
# Already in Tauri's tree, through `url`.
percent-encoding = "2"
tauri = "2"
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = "2"

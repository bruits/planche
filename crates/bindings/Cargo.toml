[package]
name = "bindings"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
board.workspace = true
format.workspace = true
js-sys = "0.3"
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"

[build-dependencies]
board = { workspace = true, features = ["ts"] }

# So that board's tests of its TypeScript run in the workspace's tests, which `cargo test -p board`
# skips without `--features ts`.
[dev-dependencies]
board = { workspace = true, features = ["ts"] }

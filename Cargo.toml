[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Dependencies only point inward, see CONTRIBUTING.md#getting-started.
board = { path = "crates/board" }
folder = { path = "crates/folder" }
format = { path = "crates/format" }
mcp = { path = "crates/mcp" }

serde = { version = "1", features = ["derive"] }
# Without float_roundtrip, some floats read back one bit off, and saving would rewrite
# element files nobody touched.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
thiserror = "2"
# Declares Rust types to the web app's TypeScript, where they cross as JSON.
ts-rs = { version = "12", default-features = false, features = [
  "serde-compat",
  "no-serde-warnings",
] }

[patch.crates-io]
# 0.2.4 clears disposed frames under lossy ones with the wrong stride (image-rs/image-webp#178).
# Dropped at its next release.
image-webp = { git = "https://github.com/image-rs/image-webp", rev = "28bed2274df92d600a823004e2fedd498ead4619" }

# Dependencies only, which build once. The renderer's WASM gets an eighth smaller, and one unit
# would gain the core's WASM little for slower rebuilds of the workspace's own crates.
[profile.release.package."*"]
codegen-units = 1
